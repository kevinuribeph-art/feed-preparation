<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mesa de trabajo</title>
<script>try { if (localStorage.getItem('mesa-tema') === 'oscuro') { document.documentElement.dataset.theme = 'dark'; var st = document.createElement('style'); st.textContent = 'body{background:#15110E !important;color:#F1EBE3 !important;color-scheme:dark}'; document.head.appendChild(st); } } catch (e) { /* light */ }</script>
</head>
<body style="margin:0;font:14px -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#F4EFE8;color:#16110E">
<p style="padding:20px">Abriendo la mesa…</p>
<noscript><p style="padding:20px">La mesa necesita JavaScript.</p></noscript>
<script src="mesa.js?v=4.07"></script>
<script>
  window.MESA && MESA.boot ? MESA.boot().catch(function (e) { document.body.textContent = 'No se pudo abrir la mesa: ' + e; })
                           : (document.body.textContent = 'No se pudo cargar mesa.js. Recarga la página.');
</script>
<script>
  // a module that arrives but throws while it runs is «fallo», like one that doesn't arrive (D-115): each one says «ok» at its end
  window.addEventListener('error', function (e) {
    var m = /\/(?:kits\/)?(motor|diseno|libre|calendario|revisar|historias|carpetas|descargar|controles)\.js(?:\?|$)/.exec(e.filename || ''), C = window.MESA_CARGA = window.MESA_CARGA || {};
    if (m && C[m[1]] !== 'ok') C[m[1]] = 'fallo';
  });
</script>
<!-- the designer, its engine, the editor, the calendar, the review, the stories, the folders, the downloads and the mesa's own dropdowns, dates and times load on their own: the mesa never waits for them («Editar …» does) -->
<script async src="kits/motor.js?v=1.6" onerror="(window.MESA_CARGA = window.MESA_CARGA || {}).motor = 'fallo'"></script>
<script async src="diseno.js?v=1.18" onerror="(window.MESA_CARGA = window.MESA_CARGA || {}).diseno = 'fallo'"></script>
<script async src="libre.js?v=1.55" onerror="(window.MESA_CARGA = window.MESA_CARGA || {}).libre = 'fallo'"></script>
<script async src="calendario.js?v=1.16" onerror="(window.MESA_CARGA = window.MESA_CARGA || {}).calendario = 'fallo'; try { MESA._in.trayFold(); } catch (e) { /* */ }"></script>
<script async src="revisar.js?v=1.7" onerror="(window.MESA_CARGA = window.MESA_CARGA || {}).revisar = 'fallo'"></script>
<script async src="historias.js?v=1.13" onerror="(window.MESA_CARGA = window.MESA_CARGA || {}).historias = 'fallo'"></script>
<script async src="carpetas.js?v=1.3" onerror="(window.MESA_CARGA = window.MESA_CARGA || {}).carpetas = 'fallo'"></script>
<script async src="descargar.js?v=1.4" onerror="(window.MESA_CARGA = window.MESA_CARGA || {}).descargar = 'fallo'"></script>
<script async src="controles.js?v=1.2" onerror="(window.MESA_CARGA = window.MESA_CARGA || {}).controles = 'fallo'"></script>
</body>
</html>
